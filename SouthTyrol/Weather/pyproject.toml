[project]
name = "south-tyrol-weather"
version = "0.2.0"
description = "South Tyrol weather data pipeline"
authors = [
    {name = "chizzali"}
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "requests>=2.28",
    "duckdb>=0.10",
    "openpyxl>=3.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
weather = "south_tyrol_weather.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
