[tool.poetry]
name = "south-tyrol-tourism"
version = "0.1.0"
description = "Spatial analysis of tourism establishments in South Tyrol, Italy"
authors = ["Lucas Chizzali <lucas.chizzali@me.com>"]
packages = [{include = "south_tyrol_tourism"}]

[tool.poetry.dependencies]
python = "^3.11"
streamlit = "^1.30"
pandas = "^2.0"
geopandas = "^1.0"
geoviews = "^1.11"
numpy = "^1.25"
bokeh = "^3.0"
scikit-learn = "^1.3"
holoviews = "^1.18"
scipy = "^1.11"
pydantic-settings = "^2.0"
loguru = "^0.7"
ipython = "^9.13.0"
seaborn = "^0.13.2"
notebook = "^7.5.6"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4"
pytest = "^7.0"
shapely = "^2.0"

[tool.poetry.scripts]
prepare-dirs                = "south_tyrol_tourism.pipeline:prepare_dirs"
download-accommodations     = "south_tyrol_tourism.pipeline:download_accommodations"
parse-accommodations        = "south_tyrol_tourism.pipeline:parse_accommodations"
download-rooms              = "south_tyrol_tourism.pipeline:download_room_info"
prepare-data                = "south_tyrol_tourism.pipeline:prepare_data"
prepare-dashboard           = "south_tyrol_tourism.dashboard_data:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "PTH", "ANN", "RUF"]
ignore = [
    "ANN101",  # self annotation not required
    "ANN102",  # cls annotation not required
    "ANN401",  # Any allowed for complex third-party types
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
